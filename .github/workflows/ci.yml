name: Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Run SpotBugs and Find Security Bugs
        run: bash ./mvnw -B compile spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: target/security-reports/spotbugs/
          if-no-files-found: error

      - name: Run OWASP Dependency-Check
        if: always()
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./mvnw -B dependency-check:check -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/security-reports/dependency-check/
          if-no-files-found: error
