services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: lab1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-roles.sql:/docker-entrypoint-initdb.d/01-create-roles.sql:ro

volumes:
  postgres_data:
